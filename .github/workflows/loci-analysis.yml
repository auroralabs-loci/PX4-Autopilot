name: LOCI Analysis
on:
  push:
    branches:
      - loci/main-*
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  loci:
    if: vars.UPSTREAM_REPO != ''
    runs-on: ubuntu-latest

    env:
      # @configure: LOCI project name, the LOCI_PROJECT variable by default
      LOCI_PROJECT: '${{ vars.LOCI_PROJECT }}'
      LOCI_API_KEY: '${{ secrets.LOCI_API_KEY }}'
      LOCI_BACKEND_URL: '${{ vars.LOCI_BACKEND_URL }}'
      GH_TOKEN: ${{ secrets.MIRROR_REPOS_WRITE_PAT }}

    environment: ${{ vars.LOCI_ENV || 'PROD__AL_DEMO' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.sha) || github.sha }}

      - name: Compute target
        id: target
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && startsWith(github.ref_name, 'loci/main-'))
        run: |
          branch="${{ github.ref_name }}"
          sha="${branch#loci/main-}"
          echo "value=main@${sha}" >> "$GITHUB_OUTPUT"

      - name: Compute base
        id: base
        if: github.event_name == 'pull_request'
        run: |
          git remote add upstream "https://github.com/${{ vars.UPSTREAM_REPO }}.git" 2>/dev/null || true   
          git fetch upstream                                                                               
          upstream_default=$(gh api "repos/${{ vars.UPSTREAM_REPO }}" --jq .default_branch)                
          merge_base=$(git merge-base HEAD "upstream/${upstream_default}")                                 
          short_sha="${merge_base:0:7}"                                                                    
          echo "value=main@${short_sha}" >> "$GITHUB_OUTPUT"                                               

      # PX4's build rejects a version that is not a vX.Y.Z tag, and the mirror has no tags.
      - name: Fetch upstream tags
        run: git fetch --no-recurse-submodules "https://github.com/${{ vars.UPSTREAM_REPO }}.git" '+refs/tags/*:refs/tags/*'
        shell: bash -euo pipefail {0}

      # @configure: Install build dependencies for your project
      - name: Install dependencies
        id: image
        run: |
          image=$(sed -n 's/^  default: "\(.*\)"$/\1/p' Tools/ci/build_all_config.yml)
          docker pull "$image"
          echo "value=$image" >> "$GITHUB_OUTPUT"
        shell: bash -euo pipefail {0}

      # @configure: Build your project binaries
      - name: Build
        run: |
          docker run --rm -w "$PWD" -v "$PWD:$PWD" --user "$(id -u):$(id -g)" -e HOME=/tmp \
            "${{ steps.image.outputs.value }}" make px4_fmu-v4_default
        shell: bash -euo pipefail {0}

      - name: Upload
        uses: auroralabs-loci/loci-action@v1
        with:
          mode: upload
          # @configure: List your binary paths/directories/globs 
          binaries: |
                build/px4_fmu-v4_default/px4_fmu-v4_default.elf
          project: '${{ env.LOCI_PROJECT }}'
          target: ${{ steps.target.outputs.value || ''}}
          base: ${{ steps.base.outputs.value || '' }}
